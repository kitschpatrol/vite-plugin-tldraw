publicHoistPattern:
  - '@kitschpatrol/repo-config'
  - '@kitschpatrol/typescript-config'
  - 'case-police'
  - '*cspell*'
  - '*eslint*'
  - '*knip*'
  - '*mdat*'
  - '*prettier*'
  - '*remark*'
  - '*stylelint*'
allowBuilds:
  esbuild: true
  oxc-resolver: true
  puppeteer: true
  unrs-resolver: true
peerDependencyRules:
  allowedVersions:
    # Remove once eslint-plugin-jsx-a11y declares ESLint 10 support (jsx-eslint/eslint-plugin-jsx-a11y#1081)
    'eslint-plugin-jsx-a11y>eslint': '10'
